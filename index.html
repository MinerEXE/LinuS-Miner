  :root{
    --felt1:#14543f; --felt2:#0a2e22;

  html,body{height:100%;overflow:hidden}
  body{
    display:flex;flex-direction:column;
    background:radial-gradient(120% 90% at 50% 20%, var(--felt1) 0%, var(--felt2) 100%);

    color:var(--ink);
    touch-action:manipulation;
    user-select:none;-webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;

  nav{

  #toast{

  .demo-tiles{display:flex;justify-content:center;gap:14px;margin:10px 0 4px}

    width:58px;height:76px;border-radius:9px;

<body>
<header>
  <span class="title">🀄 Zen Mahjong</span>
  <span class="stats">
    <span><small>TIME</small><b id="st-time">0:00</b></span>
    <span><small>TILES</small><b id="st-tiles">–</b></span>

  <div class="body" id="ov-body"></div>

</div></div>

<script>
'use strict';
/* ============================================================
   Zen Mahjong — mahjong solitaire, 100% free, no ads, offline.
   ============================================================ */

/* roundRect polyfill for older Android WebViews */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);     this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}

/* ---------- tile kinds ---------- */
const CN_NUM = ['','一','二','三','四','五','六','七','八','九'];
function kindOf(code){
  const suit = code[0], v = code.slice(1);
  return { suit, v: (suit==='w'||suit==='g') ? v : +v,
           match: (suit==='f'||suit==='s') ? suit : code };
}
function fullSet(){        // the traditional 144-tile set
  const ks = [];
  const add = (code,n)=>{ for(let i=0;i<n;i++) ks.push(kindOf(code)); };
  for(let v=1;v<=9;v++){ add('c'+v,4); add('b'+v,4); add('d'+v,4); }
  ['wE','wS','wW','wN'].forEach(c=>add(c,4));
  ['gR','gG','gH'].forEach(c=>add(c,4));
  for(let v=1;v<=4;v++){ add('f'+v,1); add('s'+v,1); }
  return ks;
}
const setOf = codes => codes.flatMap(c=>[0,0,0,0].map(()=>kindOf(c)));

/* ---------- board layouts (coords in half-tile units) ---------- */
function grid(x0,y0,cols,rows,z){
  const P=[];
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) P.push({x:x0+2*i, y:y0+2*j, z});
  return P;
}
function turtle(){         // the classic 144-tile turtle
  const P = [];
  const spans = [[0,2,24],[2,6,20],[4,4,22],[6,2,24],[8,2,24],[10,4,22],[12,6,20],[14,2,24]];
  for(const [y,x0,x1] of spans) for(let x=x0;x<=x1;x+=2) P.push({x,y,z:0});
  P.push({x:0,y:7,z:0}); P.push({x:26,y:7,z:0}); P.push({x:28,y:7,z:0});
  P.push(...grid(8,2,6,6,1), ...grid(10,4,4,4,2), ...grid(12,6,2,2,3), {x:13,y:7,z:4});
  return P;
}
const LAYOUTS = {
  small: {
    label:'Small', sub:'48 tiles · nice big tiles',
    positions: ()=>[...grid(0,0,6,6,0), ...grid(3,2,3,4,1)],
    kinds: ()=>setOf(['gR','gG','gH','wE','wS','wW','wN','d1','d5','d9','b1','c1'])
  },
  medium: {
    label:'Medium', sub:'84 tiles',
    positions: ()=>[
      ...grid(0,0,8,8,0).filter(p=>!((p.x===0||p.x===14)&&(p.y===0||p.y===14))),
      ...grid(2,4,6,4,1)],
    kinds: ()=>setOf(['gR','gG','gH','wE','wS','wW','wN',
                      'd1','d2','d3','d4','d5','d6','d7','d8','d9',
                      'b1','b3','b5','b7','b9'])
  },
  classic: {
    label:'Large', sub:'144 tiles · the classic turtle',
    positions: turtle,
    kinds: fullSet
  }
};

/* ---------- state ---------- */
let layoutKey = 'small';
let positions = [];      // current layout's positions
let tiles = [];          // {x,y,z,kind,removed}
let selected = null;
let partnerSet = new Set();   // free tiles matching the selected one
let undoStack = [];
let hintPair = null, hintIdx = 0;
let seconds = 0, timerId = null, playing = false;
let anims = [];          // fade-out animations
let flash = [];          // {t,until} red flashes for invalid taps
let solutionOrder = [];  // pair order the deal was built in (a valid solution)
let soundOn = localStorage.getItem('zm-sound') !== 'off';
let lastBlockedToast = -Infinity;

const $ = id => document.getElementById(id);
const canvas = $('board'), ctx = canvas.getContext('2d');

/* ---------- helpers ---------- */
const shuffleArr = a => { for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

function makePairs(kinds){
  const groups = {};
  for(const k of kinds) (groups[k.match] ||= []).push(k);
  const pairs = [];
  for(const key in groups){
    const g = shuffleArr(groups[key].slice());
    for(let i=0;i<g.length;i+=2) pairs.push([g[i],g[i+1]]);
  }
  return shuffleArr(pairs);
}

function posFree(i, pos, occ){
  const p = pos[i];
  let left=false, right=false;
  for(let j=0;j<pos.length;j++){
    if(j===i || !occ[j]) continue;
    const o = pos[j];
    if(o.z===p.z+1 && Math.abs(o.x-p.x)<2 && Math.abs(o.y-p.y)<2) return false;
    if(o.z===p.z && Math.abs(o.y-p.y)<2){
      if(o.x===p.x-2) left=true; else if(o.x===p.x+2) right=true;
    }
  }
  return !(left && right);
}

/* Build a guaranteed-solvable assignment by playing the game in reverse. */
function solvableDeal(pos, kinds){
  for(let attempt=0; attempt<300; attempt++){
    const pairs = makePairs(kinds);
    const occ = pos.map(()=>true);
    const assign = new Array(pos.length);
    const order = [];
    let ok = true;
    for(const [ka,kb] of pairs){
      const free = [];
      for(let i=0;i<pos.length;i++) if(occ[i] && posFree(i,pos,occ)) free.push(i);
      if(free.length < 2){ ok=false; break; }
      const ai = free.splice(Math.random()*free.length|0,1)[0];
      const bi = free.splice(Math.random()*free.length|0,1)[0];
      assign[ai]=ka; assign[bi]=kb; occ[ai]=occ[bi]=false;
      order.push({a:ai,b:bi});
    }
    if(ok) return {assign, order};
  }
  return null;
}

/* ---------- game actions ---------- */
function newGame(key){
  layoutKey = key || layoutKey;
  localStorage.setItem('zm-layout', layoutKey);
  const L = LAYOUTS[layoutKey];
  positions = L.positions();
  const deal = solvableDeal(positions, L.kinds());
  const assign = deal ? deal.assign : shuffleArr(L.kinds());
  solutionOrder = deal ? deal.order : [];
  tiles = positions.map((p,i)=>({x:p.x,y:p.y,z:p.z,kind:assign[i],removed:false}));
  selected=null; partnerSet=new Set(); undoStack=[]; hintPair=null; hintIdx=0; anims=[]; flash=[];
  seconds=0; playing=true;
  clearInterval(timerId);
  timerId = setInterval(()=>{
    if(playing && !document.hidden && !$('overlay').classList.contains('show')){
      seconds++; $('st-time').textContent = fmtTime(seconds);
    }
  },1000);
  hideOverlay(); computeMetrics(); updateHud();
}

function isFree(t){
  if(t.removed) return false;
  let left=false,right=false;
  for(const o of tiles){
    if(o===t || o.removed) continue;
    if(o.z===t.z+1 && Math.abs(o.x-t.x)<2 && Math.abs(o.y-t.y)<2) return false;
    if(o.z===t.z && Math.abs(o.y-t.y)<2){
      if(o.x===t.x-2) left=true; else if(o.x===t.x+2) right=true;
    }
  }
  return !(left&&right);
}

function freeTiles(){ return tiles.filter(isFree); }

function matchingPairs(){
  const free = freeTiles(), out = [];
  for(let i=0;i<free.length;i++)
    for(let j=i+1;j<free.length;j++)
      if(free[i].kind.match===free[j].kind.match) out.push([free[i],free[j]]);
  return out;
}

function tilesLeft(){ return tiles.reduce((n,t)=>n+!t.removed,0); }

function select(t){
  selected = t;
  partnerSet = t ? new Set(freeTiles().filter(o=>o!==t && o.kind.match===t.kind.match)) : new Set();
}

function removePair(a,b){
  a.removed=b.removed=true;
  undoStack.push([a,b]);
  anims.push({t:a,start:performance.now()},{t:b,start:performance.now()});
  select(null); hintPair=null;
  beep(660,.08); setTimeout(()=>beep(880,.08),70);
  afterMove();
}

function afterMove(){
  updateHud();
  const left = tilesLeft();
  if(left===0){
    playing=false; clearInterval(timerId);
    const bkey = 'zm-best-'+layoutKey;
    const best = +(localStorage.getItem(bkey)||0);
    const isBest = !best || seconds<best;
    if(isBest) localStorage.setItem(bkey, seconds);
    setTimeout(()=>showOverlay('🎉 You won!',
      `<p class="center">You cleared the whole board in <b>${fmtTime(seconds)}</b>!</p>`+
      `<p class="center">${isBest?'That is your best time! 🏆':'Your best: '+fmtTime(best)}</p>`,
      [['Play again',()=>newGame()],['Choose board size',showMenu]]), 500);
    beep(523,.12); setTimeout(()=>beep(659,.12),120); setTimeout(()=>beep(784,.2),240);
  } else if(matchingPairs().length===0){
    setTimeout(()=>{
      if(playing && tilesLeft()>0 && matchingPairs().length===0)
        showOverlay('No more pairs',
          `<p class="center">${tilesLeft()} tiles are left, but none of the open ones match.</p>
           <p class="center">Don't worry — just mix the tiles and keep going!</p>`,
          [['⇄ Mix the tiles',()=>{hideOverlay();doShuffle();}],
           ['↶ Take back last move',()=>{hideOverlay();doUndo();}],
           ['Start over',()=>newGame()]]);
    }, 450);
  }
}

function doUndo(){
  const last = undoStack.pop();
  if(!last) return;
  last[0].removed=last[1].removed=false;
  select(null); hintPair=null;
  hideOverlay(); updateHud(); beep(330,.06);
}

function doShuffle(){
  const remaining = tiles.filter(t=>!t.removed);
  if(remaining.length===0) return;
  if(remaining.length>=4){
    const pos = remaining.map(t=>({x:t.x,y:t.y,z:t.z}));
    const deal = solvableDeal(pos, remaining.map(t=>t.kind));
    if(deal){
      remaining.forEach((t,i)=>t.kind=deal.assign[i]);
    } else {
      const ks = shuffleArr(remaining.map(t=>t.kind)); // structural dead-end fallback
      remaining.forEach((t,i)=>t.kind=ks[i]);
    }
    undoStack=[];
  }
  select(null); hintPair=null;
  updateHud();
  if(matchingPairs().length===0){
    const btns = [];
    if(undoStack.length) btns.push(['↶ Take back moves',()=>{hideOverlay();doUndo();}]);
    btns.push(['Start a new game',()=>newGame()]);
    showOverlay('Still stuck',
      '<p class="center">The last tiles are stacked on top of each other, so no mix can free them. It happens to everyone!</p>', btns);
  } else if(remaining.length<4){
    toast('Almost there — the last tiles already match!');
  } else {
    beep(440,.1);
    toast('Tiles mixed — new pairs are ready!');
  }
}

function doHint(){
  const pairs = matchingPairs();
  if(!pairs.length) return;
  hintPair = pairs[hintIdx++ % pairs.length];
  select(null);
  beep(550,.06);
}

/* ---------- HUD / overlay / toast ---------- */
const fmtTime = s => `${s/60|0}:${String(s%60).padStart(2,'0')}`;
function updateHud(){
  $('st-time').textContent = fmtTime(seconds);
  $('st-tiles').textContent = tilesLeft();
  $('st-moves').textContent = matchingPairs().length;
  $('btn-undo').disabled = undoStack.length===0;
}
function showOverlay(title, html, btns){
  $('ov-title').textContent=title; $('ov-body').innerHTML=html;
  const box=$('ov-btns'); box.innerHTML='';
  for(const [label,fn,cls] of btns){
    const b=document.createElement('button');
    b.innerHTML=label; if(cls) b.className=cls;
    b.onclick=fn; box.appendChild(b);
  }
  // ghost-click shield: the tap that opened this overlay must not press a button
  const card = $('overlay').firstElementChild;
  card.style.pointerEvents='none';
  setTimeout(()=>{ card.style.pointerEvents=''; }, 350);
  $('overlay').classList.add('show');
}
function hideOverlay(){ $('overlay').classList.remove('show'); }

let toastTimer=null;
function toast(msg){
  const el=$('toast');
  el.textContent=msg; el.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.opacity=0, 2800);
}

/* ---------- menu & tutorial ---------- */
function showMenu(){
  const rows = Object.entries(LAYOUTS).map(([key,L])=>
    [`${L.label}<small>${L.sub}</small>`, ()=>newGame(key)]);
  const btns = [...rows, ['❓ How to play', ()=>showHowTo(showMenu), 'quiet']];
  if(tiles.length && tilesLeft()>0 && playing) btns.push(['Keep playing', hideOverlay, 'quiet']);
  showOverlay('Choose a board', '<p class="center">Smaller boards have bigger tiles — great to start with!</p>', btns);
}
function showHowTo(back){
  showOverlay('How to play',
    `<div class="demo-tiles"><div class="demo-tile">中</div><div class="demo-tile">中</div></div>
     <p class="center" style="margin-bottom:16px"><b>Find two tiles with the same picture.</b></p>
     <p>1️⃣ Tap one tile — it lights up <b style="color:#b8860b">gold</b>, and every tile that matches it starts to glow.</p>
     <p>2️⃣ Tap the matching tile — both disappear!</p>
     <p>3️⃣ A tile can only be picked when <b>nothing lies on top of it</b> and it is <b>open on a side</b>. Blocked tiles wiggle red if you tap them.</p>
     <p>4️⃣ Clear every tile from the board and you win! 🎉</p>
     <p>Stuck? Tap 💡 <b>HINT</b> to see a pair, ↶ <b>UNDO</b> to take a move back, or ⇄ <b>SHUFFLE</b> to mix the remaining tiles. Take all the time you like — there is no rush.</p>`,
    [[back?'⬅ Back':"Let's play!", ()=>{
        localStorage.setItem('zm-seen','1');
        back ? back() : hideOverlay();
      }]]);
}

/* ---------- sound (tiny WebAudio blips, no assets) ---------- */
let audioCtx=null;
function beep(freq,dur){
  if(!soundOn) return;
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(.12,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

/* ---------- rendering ---------- */
let M = null; // metrics
function layoutBounds(){
  let mx=0,my=0,mz=0;
  for(const p of positions){ mx=Math.max(mx,p.x); my=Math.max(my,p.y); mz=Math.max(mz,p.z); }
  return {maxX:mx, maxY:my, W:mx+2, H:my+2, Z:mz};
}
function computeMetrics(){
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  canvas.width = Math.max(1,cssW*dpr); canvas.height = Math.max(1,cssH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const b = layoutBounds();
  const pad = 10, R = 1.32;
  // rotate wide boards 90° on tall screens so tiles stay big
  const transposed = cssH > cssW*1.15 && b.W > b.H*1.15;
  const Wt = transposed ? b.H : b.W;   // half-units across the screen
  const Ht = transposed ? b.W : b.H;
  const A = cssW-2*pad, B = cssH-2*pad;
  let cx, cy;                          // px per half-unit on screen x / y
  if(!transposed){ cx = Math.min(A/(Wt+0.28*b.Z), B/((Ht+0.20*b.Z)*R)); cy = cx*R; }
  else           { cy = Math.min(B/(Ht+0.20*b.Z), A/((Wt+0.28*b.Z)*R)); cx = cy*R; }
  const sW = 2*cx, sH = 2*cy;          // screen tile size
  const ex = sW*0.14, ey = sH*0.10;    // 3-D layer lift
  const boardW = Wt*cx + b.Z*ex, boardH = Ht*cy + b.Z*ey;
  M = { cx, cy, sW, sH, ex, ey, transposed, maxY: b.maxY,
        basis: Math.min(sW, sH*1.25),
        ox: (cssW-boardW)/2 + b.Z*ex, oy: (cssH-boardH)/2 + b.Z*ey, cssW, cssH };
}

function tileScreen(t){
  return M.transposed
    ? { x: M.ox + (M.maxY-t.y)*M.cx - t.z*M.ex, y: M.oy + t.x*M.cy - t.z*M.ey }
    : { x: M.ox + t.x*M.cx - t.z*M.ex,          y: M.oy + t.y*M.cy - t.z*M.ey };
}

function drawOrder(){
  return tiles
    .map(t=>({t, ...tileScreen(t)}))
    .sort((a,b)=> a.t.z-b.t.z || a.y-b.y || a.x-b.x);
}

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

function drawTile(t, alpha=1, scale=1){
  const {sW,sH,ex,ey,basis} = M;
  let {x,y} = tileScreen(t);
  if(scale!==1){ x += sW*(1-scale)/2; y += sH*(1-scale)/2; }
  const w=sW*scale, h=sH*scale, r=Math.min(w,h)*0.15;
  ctx.save(); ctx.globalAlpha = alpha;
  // side (right + bottom extrusion)
  ctx.fillStyle = '#b99b62';
  rr(x+ex*.9, y+ey*.9, w, h, r); ctx.fill();
  ctx.fillStyle = '#d8bd85';
  rr(x+ex*.45, y+ey*.45, w, h, r); ctx.fill();
  // face
  const g = ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#fdf8ea'); g.addColorStop(1,'#efe3c3');
  ctx.fillStyle = g;
  rr(x,y,w,h,r); ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(120,90,40,.55)'; ctx.stroke();
  drawKindFace(t.kind, x+w*0.08, y+h*0.07, w*0.84, h*0.86, basis);
  // highlights
  const now = performance.now();
  const sel = t===selected;
  const partner = partnerSet.has(t);
  const hint = hintPair && (t===hintPair[0]||t===hintPair[1]);
  const flashing = flash.some(f=>f.t===t && f.until>now);
  if(sel || hint || partner || flashing){
    const pulse = 0.55+0.45*Math.sin(now/170);
    ctx.lineWidth = Math.max(2.5, Math.min(w,h)*0.08);
    ctx.strokeStyle = flashing ? '#ff3b30' : sel ? '#ffb300' : hint ? '#37d5ff' : `rgba(255,196,0,${pulse})`;
    rr(x+1.5,y+1.5,w-3,h-3,r); ctx.stroke();
    ctx.fillStyle = flashing ? 'rgba(255,59,48,.22)' : sel ? 'rgba(255,179,0,.18)'
                  : hint ? 'rgba(55,213,255,.16)' : `rgba(255,196,0,${0.12*pulse})`;
    rr(x,y,w,h,r); ctx.fill();
  }
  ctx.restore();
}

const FACE_FONT = '"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif';
const SPOT_COLORS = ['#b02418','#1c6e3c','#1a3a6b'];
const DOT_PAT = {
  1:[[.5,.5]], 2:[[.5,.28],[.5,.72]], 3:[[.25,.22],[.5,.5],[.75,.78]],
  4:[[.3,.26],[.7,.26],[.3,.74],[.7,.74]],
  5:[[.27,.25],[.73,.25],[.5,.5],[.27,.75],[.73,.75]],
  6:[[.32,.24],[.68,.24],[.32,.5],[.68,.5],[.32,.76],[.68,.76]],
  7:[[.24,.16],[.5,.22],[.76,.28],[.32,.56],[.68,.56],[.32,.84],[.68,.84]],
  8:[[.32,.19],[.68,.19],[.32,.4],[.68,.4],[.32,.61],[.68,.61],[.32,.82],[.68,.82]],
  9:[[.26,.24],[.5,.24],[.74,.24],[.26,.5],[.5,.5],[.74,.5],[.26,.76],[.5,.76],[.74,.76]]
};

function drawKindFace(k, x, y, w, h, basis){
  const cx=x+w/2, cy=y+h/2;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(k.suit==='c'){                       // characters 萬
    ctx.fillStyle='#1a3a6b';
    ctx.font=`700 ${basis*0.36}px ${FACE_FONT}`;
    ctx.fillText(CN_NUM[k.v], cx, y+h*0.26);
    ctx.fillStyle='#b02418';
    ctx.font=`700 ${basis*0.42}px ${FACE_FONT}`;
    ctx.fillText('萬', cx, y+h*0.72);
  } else if(k.suit==='d'){                // dots
    const pat = DOT_PAT[k.v], big = k.v===1;
    const rad = basis*(big?0.23:(k.v<=4?0.11:0.09));
    pat.forEach(([px,py],i)=>{
      const dx=x+px*w, dy=y+py*h, col=SPOT_COLORS[i%3];
      ctx.beginPath(); ctx.arc(dx,dy,rad,0,7); ctx.fillStyle=col; ctx.fill();
      ctx.beginPath(); ctx.arc(dx,dy,rad*0.55,0,7);
      ctx.fillStyle='#fdf8ea'; ctx.fill();
      ctx.beginPath(); ctx.arc(dx,dy,rad*0.25,0,7); ctx.fillStyle=col; ctx.fill();
    });
  } else if(k.suit==='b'){                // bamboo
    if(k.v===1){ drawStick(cx,cy,basis*0.21,h*0.6,'#1c6e3c'); }
    else DOT_PAT[k.v].forEach(([px,py],i)=>
      drawStick(x+px*w, y+py*h, basis*(k.v<=4?0.115:0.095), h*(k.v<=4?0.26:0.18),
        i%3===2 ? '#b02418' : '#1c6e3c'));
  } else if(k.suit==='w'){                // winds
    ctx.fillStyle='#1a2b4a';
    ctx.font=`700 ${basis*0.55}px ${FACE_FONT}`;
    ctx.fillText({E:'東',S:'南',W:'西',N:'北'}[k.v], cx, cy+h*0.02);
  } else if(k.suit==='g'){                // dragons
    if(k.v==='H'){
      ctx.lineWidth=basis*0.055; ctx.strokeStyle='#1a3a6b';
      rr(x+w*0.24,y+h*0.2,w*0.52,h*0.6,basis*0.04); ctx.stroke();
    } else {
      ctx.fillStyle = k.v==='R' ? '#b02418' : '#1c6e3c';
      ctx.font=`700 ${basis*0.55}px ${FACE_FONT}`;
      ctx.fillText(k.v==='R'?'中':'發', cx, cy+h*0.02);
    }
  } else {                                // flowers / seasons
    const ch = k.suit==='f' ? ['','梅','蘭','菊','竹'][k.v] : ['','春','夏','秋','冬'][k.v];
    ctx.fillStyle = k.suit==='f' ? '#c2185b' : '#0b7285';
    ctx.font=`700 ${basis*0.46}px ${FACE_FONT}`;
    ctx.fillText(ch, cx, cy+h*0.06);
    ctx.fillStyle='#1a3a6b';
    ctx.font=`700 ${basis*0.17}px ${FACE_FONT}`;
    ctx.textAlign='left'; ctx.fillText(k.v, x+w*0.05, y+h*0.13); ctx.textAlign='center';
  }
}
function drawStick(cx,cy,w,h,col){
  ctx.fillStyle=col;
  rr(cx-w/2,cy-h/2,w,h,w*0.4); ctx.fill();
  ctx.fillStyle='rgba(253,248,234,.9)';
  ctx.fillRect(cx-w/2, cy-h*0.06, w, h*0.12);
}

function render(now){
  if(canvas.clientWidth!==M.cssW || canvas.clientHeight!==M.cssH) computeMetrics();
  ctx.clearRect(0,0,M.cssW,M.cssH);
  for(const e of drawOrder()) if(!e.t.removed) drawTile(e.t);
  flash = flash.filter(f=>f.until>now);
  anims = anims.filter(a=>{
    const p = (now-a.start)/220;
    if(p>=1) return false;
    drawTile(a.t, 1-p, 1+p*0.25);
    return true;
  });
  requestAnimationFrame(render);
}

/* ---------- input ---------- */
function tileAt(px,py){
  const order = drawOrder();
  for(let i=order.length-1;i>=0;i--){
    const e=order[i]; if(e.t.removed) continue;
    if(px>=e.x && px<=e.x+M.sW && py>=e.y && py<=e.y+M.sH) return e.t;
  }
  return null;
}

canvas.addEventListener('pointerdown', e=>{
  if(!playing || $('overlay').classList.contains('show')) return;
  const rect = canvas.getBoundingClientRect();
  const t = tileAt(e.clientX-rect.left, e.clientY-rect.top);
  if(window.__zmdebug) (window.__zmlog ||= []).push(
    {x:+e.clientX.toFixed(1), y:+e.clientY.toFixed(1), pt:e.pointerType,
     hit: t?tiles.indexOf(t):null, sel: selected?tiles.indexOf(selected):null});
  if(!t){ select(null); return; }
  if(!isFree(t)){
    flash.push({t, until: performance.now()+600});
    if(performance.now()-lastBlockedToast>2500){
      lastBlockedToast = performance.now();
      toast('That tile is trapped — it needs a free side and nothing on top.');
    }
    beep(180,.07); return;
  }
  if(selected===t){ select(null); beep(330,.05); return; }
  if(selected && selected.kind.match===t.kind.match){ removePair(selected,t); return; }
  if(selected){
    if(partnerSet.size) toast('Not the same picture — the matching ones are glowing gold.');
    else toast('Not the same picture.');
  }
  hintPair=null;
  select(t); beep(440,.05);
});

$('btn-new').onclick  = showMenu;
$('btn-help').onclick = ()=>showHowTo(tiles.length?null:undefined);
$('btn-undo').onclick = doUndo;
$('btn-hint').onclick = doHint;
$('btn-shuf').onclick = doShuffle;
$('btn-snd').onclick  = function(){
  soundOn=!soundOn; localStorage.setItem('zm-sound',soundOn?'on':'off');
  this.firstChild.textContent = soundOn?'🔊':'🔇';
};
if(!soundOn) $('btn-snd').firstChild.textContent='🔇';

window.addEventListener('resize', computeMetrics);
window.addEventListener('orientationchange', ()=>setTimeout(computeMetrics,120));

/* ---------- boot ---------- */
layoutKey = localStorage.getItem('zm-layout') || 'small';
if(!LAYOUTS[layoutKey]) layoutKey = 'small';
newGame(layoutKey);
requestAnimationFrame(render);
if(!localStorage.getItem('zm-seen')) showHowTo(null);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ---------- self-test hook (?autotest=1&layout=classic): replay the solution ---------- */
if(new URLSearchParams(location.search).has('autotest')){
  soundOn=false;
  const want = new URLSearchParams(location.search).get('layout');
  if(want && LAYOUTS[want] && want!==layoutKey) newGame(want);
  hideOverlay();
  setTimeout(()=>{
    const out=$('autotest-result');
    try{
      for(const {a,b} of solutionOrder){
        const ta=tiles[a], tb=tiles[b];
        if(!isFree(ta)||!isFree(tb)) throw new Error(`tile not free at step (${a},${b})`);
        if(ta.kind.match!==tb.kind.match) throw new Error(`mismatch at step (${a},${b})`);
        ta.removed=tb.removed=true;
      }
      if(tilesLeft()!==0) throw new Error('tiles left: '+tilesLeft());
      out.textContent=`AUTOTEST-PASS layout=${layoutKey} n=${tiles.length} sw=${M.sW.toFixed(1)} transposed=${M.transposed}`;
      document.title='AUTOTEST-PASS';
    }catch(err){
      out.textContent='AUTOTEST-FAIL: '+err.message; document.title='AUTOTEST-FAIL';
    }
  }, 300);
}
</script>
</body>
